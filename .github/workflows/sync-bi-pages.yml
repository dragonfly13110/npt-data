name: Update public BI data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # 09:17, 12:17 and 17:17 Asia/Bangkok; later runs can upgrade a fallback edition.
    - cron: '17 2,5,10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public data
        uses: actions/checkout@v4
        with:
          path: site
          ref: main
      - uses: actions/setup-node@v4
        if: github.event_name != 'push'
        with:
          node-version: '22'
      - name: Check snapshot and privacy behavior
        if: github.event_name != 'push'
        run: node scripts/bi/check.mjs
        working-directory: site
      - name: Export complete batch
        id: export_snapshot
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.BI_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.BI_SUPABASE_ANON_KEY }}
        run: node scripts/bi/pages.mjs --no-queries
        working-directory: site
      - name: Use retained source batch when collection fails
        if: github.event_name != 'push' && steps.export_snapshot.outcome == 'failure'
        working-directory: site
        run: |
          mkdir -p output/bi-pages
          cp data/bi/*.json output/bi-pages/
          echo '::warning::Source collection failed. Daily briefing will disclose the retained source dates.'
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: '3.12'
      - name: Install pinned PDF and satellite image readers
        if: github.event_name != 'push'
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check -r scripts/bi/requirements.txt
        working-directory: site
      - name: Check agro-environment collection
        if: github.event_name != 'push'
        run: node scripts/bi/agro-environment.test.mjs
        working-directory: site
      - name: Collect soil moisture, NDVI classes and flood reports
        id: agro_environment
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/bi/agro-environment.mjs --output output/bi-pages --districts scripts/bi/npt-districts.json
        working-directory: site
      - name: Report retained agro-environment source data
        if: github.event_name != 'push' && steps.agro_environment.outcome == 'failure'
        run: echo '::warning::Agro-environment collection failed. Previous files and their source dates are retained; missing data is not replaced with zero.'
      - name: Read official prices and reported outbreaks
        id: market_outbreaks
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/bi/market-outbreaks.mjs --output output/bi-pages
        working-directory: site
      - name: Report retained prices and outbreak data
        if: github.event_name != 'push' && steps.market_outbreaks.outcome == 'failure'
        run: echo '::warning::Official price/outbreak batch failed. Previous JSON, source dates and hashes are retained; no empty replacement is published.'
      - name: Summarize public data in plain Thai
        id: briefing
        if: github.event_name != 'push'
        env:
          BI_GEMINI_API_KEYS: ${{ secrets.BI_GEMINI_API_KEYS }}
        run: node scripts/bi/daily-briefing.mjs --input output/bi-pages --fallback-input data/bi --output data/bi/daily-briefing
        working-directory: site
      - name: Save only BI JSON files
        if: github.event_name != 'push'
        shell: bash
        run: |
          mkdir -p site/data/bi
          cp site/output/bi-pages/*.json site/data/bi/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/bi
          if ! git diff --cached --quiet; then
            git commit -m "chore(bi): update public decision data snapshot"
            git push origin HEAD:main
          fi
          # Export scratch files are not part of the public Pages artifact.
          rm -f output/bi-pages/*.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload complete site, including existing maps and documents
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
